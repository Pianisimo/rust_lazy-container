<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rust-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7410E"/>
      <stop offset="1" stop-color="#9C370B"/>
    </linearGradient>
  </defs>
  <!-- Background: Rust orange to a slightly darker shade, edge to edge -->
  <rect width="64" height="64" fill="url(#rust-background)"/>
  <!-- Container lid: the top face of an isometric cube -->
  <polygon points="32,7.1 51,18.1 32,29.1 13,18.1" fill="#FFF4EC"/>
  <!-- Container left side, split from the other faces by a 5-unit gap -->
  <polygon points="10.5,22.4 29.5,33.4 29.5,55.4 10.5,44.4" fill="#FFF4EC"/>
  <!-- Container right side -->
  <polygon points="53.5,22.4 34.5,33.4 34.5,55.4 53.5,44.4" fill="#FFF4EC"/>
</svg>
