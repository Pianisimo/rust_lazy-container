[workspace.lints.rust]
unsafe_code = "forbid"
# unused = "allow" # For experimental dev.

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

[workspace]
resolver = "2"
members = [
    "crates/examples/simple-frame",
    "crates/examples/panel-selection",
    "crates/examples/external-events",
    "crates/lazy-container",
    "crates/lib"
]

[workspace.dependencies]
ratatui = "0.30.2"
color-eyre = "0.6.5"
crossterm = "0.29.0"
notify = "9.0.0-rc.4"
